apiVersion: apps/v1
kind: Deployment

metadata:
  name: banking-frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: banking-frontend

  template:
    metadata:
      labels:
        app: banking-frontend

    spec:
      containers:
      - name: banking-frontend

        image: YOUR_DOCKERHUB_USERNAME/banking-frontend:v1

        ports:
        - containerPort: 3000
