apiVersion: apps/v1
kind: Deployment

metadata:
  name: banking-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: banking-backend

  template:
    metadata:
      labels:
       app: banking-backend

    spec:
      containers:
      - name: banking-backend

        image: YOUR_DOCKERHUB_USERNAME/banking-backend:v1

        ports:
        - containerPort: 5000

        env:
        - name: MONGO_URI
          value: mongodb://mongodb-service:27017/bankdb
