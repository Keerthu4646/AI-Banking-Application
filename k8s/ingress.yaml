apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking-ingress
spec:
  rules:
  - host: banking.local
    http:
      paths:

      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80

      - path: /account
        pathType: Prefix
        backend:
          service:
            name: account-service
            port:
              number: 5001

      - path: /transaction
        pathType: Prefix
        backend:
          service:
            name: transaction-service
            port:
              number: 5002

      - path: /chat
        pathType: Prefix
        backend:
          service:
            name: chatbot-service
            port:
              number: 5003

      - path: /recommendation
        pathType: Prefix
        backend:
          service:
            name: recommendation-service
            port:
              number: 5004

      - path: /notification
        pathType: Prefix
        backend:
          service:
            name: notification-service
            port:
              number: 5005
